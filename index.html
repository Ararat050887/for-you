<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f3">
  <meta name="description" content="У меня есть к тебе один маленький вопрос… 💌">
  <title>Для моей Виолетты 💌</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E💌%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: 'Segoe UI', system-ui, sans-serif; color: #573b42; background: #fff5f3; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; background: radial-gradient(ellipse at 15% 15%, #ffe4e5 0, transparent 48%), radial-gradient(ellipse at 90% 90%, #ffe6dc 0, transparent 48%), #fff8f5; }
    main { position: relative; width: min(100%, 550px); text-align: center; padding: 38px 38px 30px; border: 1px solid #fff; border-radius: 32px; background: #fffdfbe8; box-shadow: 0 18px 70px #ae637414, 0 3px 12px #ae637408; }
    .note { margin: 0 0 25px; color: #957078; font-size: 11px; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; }
    .picture { position: relative; margin: 0 auto 26px; width: 218px; max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: white; border-radius: 50%; }
    .picture img { width: 92%; height: 92%; object-fit: contain; border-radius: 50%; }
    .seal { position: absolute; right: -7px; bottom: 2px; display: grid; place-items: center; width: 55px; height: 55px; border: 5px solid #fffdfb; border-radius: 50%; background: #ffe5e9; font-size: 23px; transform: rotate(12deg); }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(34px, 7.5vw, 48px); font-weight: 500; line-height: 1.12; letter-spacing: -.045em; color: #613c46; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .actions[hidden] { display: none; }
    button { min-height: 49px; padding: 13px 25px; border-radius: 16px; font: 600 15px 'Segoe UI', system-ui, sans-serif; cursor: pointer; transition: transform .18s, background .18s; }
    button:hover { transform: translateY(-2px); }
    button:focus-visible, a:focus-visible { outline: 3px solid #ac4563; outline-offset: 5px; }
    .yes { color: white; border: 1px solid #c75e7b; background: #c75e7b; box-shadow: 0 5px 12px #c75e7b22; }
    .yes:hover { background: #b84e6b; }
    .no-slot { width: 91px; height: 49px; }
    .later { width: 91px; color: #86666e; border: 1px solid #ebdce0; background: #fffdfb; z-index: 5; }
    .credit { display: inline-block; margin-top: 14px; color: #a4828b; font-size: 10px; text-decoration-color: #dac3ca; }
    .heart { position: fixed; pointer-events: none; bottom: -40px; font-size: 24px; animation: float 3s ease-out forwards; }
    @keyframes float { to { transform: translateY(-105vh) rotate(35deg); opacity: 0; } }
    @media (max-width: 420px) { main { padding: 30px 20px 24px; } .picture { width: 190px; } .note { font-size: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="note">Маленькое приглашение для моей Виолетты</p>
    <div class="picture">
      <img id="cat" src="https://media1.tenor.com/m/-DY1sCSEXqUAAAAC/sad-cat.gif" alt="Милый рыжий котёнок с большими глазками" width="218" height="218">
      <span class="seal" aria-hidden="true">💌</span>
    </div>
    <div aria-live="polite" aria-atomic="true">
      <h1 id="question">Пойдём на свидание,<br>Булочка?</h1>
    </div>
    <div class="actions">
      <button class="yes" id="yes" type="button">Да, пойдём ♡</button>
      <span class="no-slot" id="no-slot"><button class="later" id="later" type="button">Нет</button></span>
    </div>
    <a class="credit" id="credit" href="https://tenor.com/search/kitty-sad-face-gifs" target="_blank" rel="noopener noreferrer">Котики · Tenor</a>
  </main>
  <script>
    const question = document.getElementById('question');
    const cat = document.getElementById('cat');
    const kissUrl = 'https://media1.tenor.com/m/MBhmqIKelSMAAAAC/peach-goma-mochi-cat.gif';
    const kissPreload = new Image();
    kissPreload.src = kissUrl;
    const yes = document.getElementById('yes');
    const later = document.getElementById('later');
    yes.addEventListener('click', () => {
      question.textContent = 'Ура!';
      cat.src = kissUrl;
      cat.alt = 'Серый котик целует белую кошечку';
      document.getElementById('credit').href = 'https://tenor.com/view/peach-goma-mochi-cat-mochi-mochi-kiss-peach-goma-love-gif-3465632787193566499';
      document.querySelector('.actions').hidden = true;
      yes.hidden = true;
      later.hidden = true;
      document.getElementById('no-slot').hidden = true;
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (let i = 0; i < 18; i++) {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.textContent = ['♡', '💕', '♥'][i % 3];
          heart.setAttribute('aria-hidden', 'true');
          heart.style.left = `${Math.random() * 95}%`;
          heart.style.color = '#c75e7b';
          heart.style.animationDelay = `${Math.random() * .7}s`;
          document.body.append(heart);
          heart.addEventListener('animationend', () => heart.remove());
        }
      }
    });
    function runAway(x, y) {
      if (later.hidden) return;
      const gap = 16;
      const width = later.offsetWidth;
      const height = later.offsetHeight;
      const maxX = Math.max(gap, innerWidth - width - gap);
      const maxY = Math.max(gap, innerHeight - height - gap);
      const yesBox = yes.getBoundingClientRect();
      const candidates = [];
      for (let i = 0; i < 24; i++) {
        const left = gap + Math.random() * (maxX - gap);
        const top = gap + Math.random() * (maxY - gap);
        if (left < yesBox.right + gap && left + width > yesBox.left - gap &&
            top < yesBox.bottom + gap && top + height > yesBox.top - gap) continue;
        candidates.push({ left, top, distance: Math.hypot(left + width / 2 - x, top + height / 2 - y) });
      }
      const target = candidates.sort((a, b) => b.distance - a.distance)[0];
      if (!target) return;
      Object.assign(later.style, { position: 'fixed', left: `${target.left}px`, top: `${target.top}px` });
    }
    document.addEventListener('pointermove', (event) => {
      if (later.hidden || event.pointerType === 'touch') return;
      const box = later.getBoundingClientRect();
      const dx = Math.max(box.left - event.clientX, 0, event.clientX - box.right);
      const dy = Math.max(box.top - event.clientY, 0, event.clientY - box.bottom);
      if (Math.hypot(dx, dy) < 55) runAway(event.clientX, event.clientY);
    });
    later.addEventListener('pointerenter', (event) => runAway(event.clientX, event.clientY));
    later.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      runAway(event.clientX, event.clientY);
    });
    later.addEventListener('click', (event) => {
      event.preventDefault();
      runAway(event.clientX, event.clientY);
    });
    window.addEventListener('resize', () => {
      later.style.position = '';
      later.style.left = '';
      later.style.top = '';
    });
  </script>
</body>
</html>
